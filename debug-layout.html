<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug Layout — Food Service DPT Preview</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0f172a;--panel:#1e293b;--line:#334155;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b;--txt:#e2e8f0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column}
  header{padding:12px 20px;background:#020617;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:1rem;letter-spacing:2px;text-transform:uppercase}
  header .tag{background:var(--warn);color:#1c1917;font-weight:800;font-size:.7rem;padding:3px 10px;border-radius:20px;letter-spacing:1px}
  .controls{display:flex;gap:16px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:flex-end}
  .group{display:flex;flex-direction:column;gap:5px}
  .group label{font-size:.66rem;text-transform:uppercase;letter-spacing:1px;color:#94a3b8;font-weight:700}
  select,button{background:#0f172a;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.85rem;font-family:inherit}
  select{min-width:270px}
  button{cursor:pointer;font-weight:700}
  button.primary{background:#2563eb;border-color:#2563eb;color:#fff}
  button:hover{filter:brightness(1.15)}
  .counts{display:flex;gap:6px;flex-wrap:wrap}
  .counts button{padding:6px 12px}
  .counts button.active{background:#2563eb;border-color:#2563eb;color:#fff}
  .counts button:disabled{opacity:.35;cursor:not-allowed}
  main{flex:1;display:flex;min-height:0}
  .stage{flex:1;overflow:auto;padding:16px;background:#0b1220;position:relative}
  .frame-wrap{transform-origin:top left;position:relative}
  iframe{border:1px solid var(--line);border-radius:8px;background:#fff;display:block}
  .side{width:440px;flex-shrink:0;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px}
  .side h2{font-size:.78rem;text-transform:uppercase;letter-spacing:1px;color:#93c5fd;margin:0 0 10px}
  .kpi{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:.84rem;margin-bottom:14px}
  .kpi .v{font-weight:800;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.74rem;font-weight:800}
  .pill.ok{background:rgba(16,185,129,.2);color:#6ee7b7}
  .pill.bad{background:rgba(239,68,68,.2);color:#fca5a5}
  .alert{background:rgba(239,68,68,.15);border:1px solid #ef4444;color:#fca5a5;border-radius:8px;padding:8px;font-size:.78rem;font-weight:700;margin-bottom:12px;display:none}
  .alert.show{display:block}
  table{width:100%;border-collapse:collapse;font-size:.76rem;margin-top:6px}
  th,td{text-align:left;padding:4px 5px;border-bottom:1px solid var(--line)}
  th{color:#94a3b8;font-size:.66rem;text-transform:uppercase;letter-spacing:1px}
  td.num{font-variant-numeric:tabular-nums}
  .problems{margin-top:8px;font-size:.74rem;color:#fca5a5;max-height:140px;overflow:auto}
  .desc{font-size:.74rem;color:#cbd5e1;background:#0b1220;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:12px;line-height:1.45}
  .hint{font-size:.71rem;color:#94a3b8;margin-top:12px;line-height:1.5}
  code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header>
  <h1>Debug Layout</h1>
  <span class="tag">PREVIEW · DATOS MOCK</span>
  <span style="font-size:.74rem;color:#94a3b8">Fixture compartido: <code>fixtures.js</code></span>
</header>

<div class="controls">
  <div class="group">
    <label>Escenario</label>
    <select id="scenario">
      <option value="A">A · Platos normales</option>
      <option value="B">B · Nombres largos en español</option>
      <option value="C">C · Nombres largos ES + traducciones largas</option>
      <option value="D">D · Platos con muchos alérgenos</option>
      <option value="E">E · Platos con muchas trazas</option>
      <option value="F">F · Largos + traducciones + alérgenos + trazas</option>
      <option value="G" selected>G · Mezcla realista cortos y largos</option>
      <option value="H">H · Caso extremo deliberadamente difícil</option>
      <option value="MENU12">MENU12_CANONICAL · fixture de referencia (12 platos)</option>
      <option value="IMPOSSIBLE">IMPOSSIBLE · no cabe ni a MIN_SCALE (unfit)</option>
    </select>
  </div>
  <div class="group">
    <label>Nº de platos</label>
    <div class="counts" id="counts"></div>
  </div>
  <div class="group">
    <label>Resolución</label>
    <select id="resolution">
      <option value="1280x720">1280 × 720</option>
      <option value="1920x1080" selected>1920 × 1080</option>
      <option value="2560x1440">2560 × 1440</option>
      <option value="3840x2160">3840 × 2160</option>
    </select>
  </div>
  <div class="group">
    <label>Vista</label>
    <select id="fit"><option value="fit" selected>Ajustar al panel</option><option value="100">100 %</option></select>
  </div>
  <div class="group"><label>&nbsp;</label><button class="primary" id="run">Ejecutar</button></div>
  <div class="group"><label>&nbsp;</label><button id="runAll">Matriz 1–20</button></div>
  <div class="group"><label>&nbsp;</label><button id="runResize">Probar resize</button></div>
</div>

<main>
  <div class="stage" id="stage">
    <div class="frame-wrap" id="frameWrap">
      <iframe id="frame" src="./comedor.html" width="1920" height="1080" title="Comedor"></iframe>
    </div>
  </div>
  <aside class="side">
    <div class="desc" id="desc"></div>
    <div class="alert" id="alert"></div>
    <h2>Resultado</h2>
    <div id="kpis" class="kpi"></div>
    <div id="matrix"></div>
    <div id="resizeBox"></div>
    <h2 style="margin-top:14px">Incidencias</h2>
    <div id="problems" class="problems">—</div>
    <div class="hint">
      Fixture único <code>MENU12_CANONICAL</code> compartido con los tests.
      <code>content-limited</code> = el contenido obliga a bajar de 0.85;
      <code>unfit-min-scale</code> = no cabe ni a 0.50 (único caso con overflow, se marca en rojo).
    </div>
  </aside>
</main>

<script src="./fixtures.js"></script>
<script>
var F = window.FIXTURES;
var DESCRIPTIONS = {
  A: 'Platos normales: nombres cortos o medios, 0–3 alérgenos.',
  B: 'Nombres largos en español, traducción corta.',
  C: 'Nombres largos en español y traducciones inglesas largas.',
  D: 'Nombres medios con los 14 alérgenos declarados.',
  E: 'Nombres medios con las 14 trazas declaradas.',
  F: 'Nombres y traducciones largos + 14 alérgenos + 14 trazas.',
  G: 'Mezcla realista: alterna platos cortos y largos con alérgenos variados.',
  H: 'Caso extremo deliberadamente difícil: nombre y traducción muy largos + 14 alérgenos + 14 trazas.',
  MENU12: 'MENU12_CANONICAL: 12 platos de referencia (cortos, largos y uno extremadamente largo, hasta 14 alérgenos y 14 trazas). Mismo fixture que usan los tests.',
  IMPOSSIBLE: 'Caso imposible: un plato tan largo que no cabe ni a MIN_SCALE=0.50. Debe marcar unfit=true.'
};
function buildData(sc, n) {
  if (sc === 'MENU12') return F.buildData('MENU12');
  if (sc === 'IMPOSSIBLE') return F.buildData('IMPOSSIBLE', n);
  return F.buildData(sc, n);
}
var frame = document.getElementById('frame');
var frameWrap = document.getElementById('frameWrap');
var stage = document.getElementById('stage');
var activeCount = 10;

function buildCountButtons() {
  var box = document.getElementById('counts');
  [1,2,4,6,8,10,12,16,20].forEach(function (n) {
    var b = document.createElement('button');
    b.textContent = n; b.dataset.n = n;
    if (n === activeCount) b.classList.add('active');
    b.onclick = function () { activeCount = n; syncCounts(); run(); };
    box.appendChild(b);
  });
}
function syncCounts() {
  var sc = document.getElementById('scenario').value;
  var fixed = (sc === 'MENU12');
  Array.prototype.forEach.call(document.getElementById('counts').children, function (c) {
    c.disabled = fixed;
    c.classList.toggle('active', fixed ? (+c.dataset.n === 12) : (+c.dataset.n === activeCount));
  });
}
function currentCount() { return document.getElementById('scenario').value === 'MENU12' ? 12 : activeCount; }
function currentResolution() { var p = document.getElementById('resolution').value.split('x'); return { w:+p[0], h:+p[1] }; }
function applyResolution() {
  var r = currentResolution();
  frame.setAttribute('width', r.w); frame.setAttribute('height', r.h);
  frame.style.width = r.w + 'px'; frame.style.height = r.h + 'px';
  fitFrame();
}
function fitFrame() {
  var r = currentResolution();
  if (document.getElementById('fit').value === '100') { frameWrap.style.transform='none'; frameWrap.style.width=r.w+'px'; frameWrap.style.height=r.h+'px'; return; }
  var k = Math.min(1, (stage.clientWidth - 32) / r.w, (stage.clientHeight - 32) / r.h);
  frameWrap.style.transform = 'scale(' + k + ')';
  frameWrap.style.width = r.w + 'px'; frameWrap.style.height = r.h + 'px';
}
function measureEvalCode(data) {
  return '(function(){' +
    'var data=' + JSON.stringify(data) + ';' +
    'try{ latestComedorData={fecha:todayStr(),platos:data}; }catch(e){}' +
    'try{ if(window.MOCK_DB&&window.MOCK_DB["menu/comedor"]) window.MOCK_DB["menu/comedor"].platos=data; }catch(e){}' +
    'window.initDishPagination(data);' +
    'var mc=document.getElementById("main-col");' +
    'var v=dishPagination.lastValidation||{ok:false,problems:[{type:"sin-validacion"}]};' +
    'var t={}; var fuera=0, clip=0, solape=0;' +
    'v.problems.forEach(function(p){ t[p.type]=(t[p.type]||0)+1; if(p.type==="child-outside-row")fuera++; if(p.type==="text-clipped")clip++; if(p.type==="row-overlap"||p.type==="blocks-overlap")solape++; });' +
    'var total=0, vacias=0; dishPagination.pages.forEach(function(p){ total+=p.length; if(!p.length) vacias++; });' +
    'return { escala:+dishPagination.scale.toFixed(3), reason:v.reason, sMax:v.sMax!==undefined?+v.sMax.toFixed(3):null, floor:v.floorScale!==undefined?+v.floorScale.toFixed(3):null, unfit:!!v.unfit,' +
    ' paginas:dishPagination.pages.map(function(p){return p.length;}), ok:v.ok, problems:t, fuera:fuera, clip:clip, solape:solape, total:total, vacias:vacias, entradas:data.length,' +
    ' overflowH: mc.scrollWidth>mc.clientWidth, overflowV: mc.scrollHeight>mc.clientHeight, filas:document.querySelectorAll("#main-col .dish-row").length };' +
  '})()';
}
function run() {
  applyResolution(); syncCounts();
  document.getElementById('desc').textContent = DESCRIPTIONS[document.getElementById('scenario').value] || '';
  var sc = document.getElementById('scenario').value;
  setTimeout(function () {
    var res = frame.contentWindow.eval(measureEvalCode(buildData(sc, currentCount())));
    showKpis(sc, currentCount(), res);
  }, 350);
}
function showKpis(sc, n, r) {
  var al = document.getElementById('alert');
  if (r.unfit || !r.ok) {
    al.classList.add('show');
    al.textContent = r.unfit
      ? 'UNFIT: el contenido NO cabe ni a MIN_SCALE=0.50. Layout NO válido (overflow explícito).'
      : 'LAYOUT NO VÁLIDO: ' + Object.keys(r.problems || {}).join(', ');
  } else { al.classList.remove('show'); al.textContent = ''; }
  document.getElementById('kpis').innerHTML =
    row('Platos', n) + row('Escala', r.escala) + row('Motivo', r.reason || '—') +
    row('sMax / suelo', (r.sMax !== null ? r.sMax : '—') + ' / ' + (r.floor !== null ? r.floor : '—')) +
    row('Páginas', r.paginas.length + ' (' + r.paginas.join('+') + ')') +
    row('Platos por página', r.paginas.join(' | ')) +
    row('Filas en página actual', r.filas) +
    row('Platos totales / entrada', r.total + ' / ' + r.entradas) +
    row('Páginas vacías', pill(r.vacias === 0) + ' <span class="v">' + r.vacias + '</span>') +
    row('Overflow horizontal', pill(!r.overflowH)) +
    row('Overflow vertical', pill(!r.overflowV)) +
    row('Clipping', pill(r.clip === 0) + ' <span class="v">' + r.clip + '</span>') +
    row('Solapamientos', pill(r.solape === 0) + ' <span class="v">' + r.solape + '</span>') +
    row('Elementos fuera', pill(r.fuera === 0) + ' <span class="v">' + r.fuera + '</span>') +
    row('Validación', pill(!!r.ok) + (r.unfit ? ' <span class="pill bad">UNFIT</span>' : ''));
  var ks = Object.keys(r.problems || {});
  document.getElementById('problems').innerHTML = ks.length ? ks.map(function (k) { return '#' + k + ' × ' + r.problems[k]; }).join('<br>') : 'Sin incidencias.';
}
function row(k, v) { return '<div>' + k + '</div><div class="v">' + v + '</div>'; }
function pill(ok) { return '<span class="pill ' + (ok ? 'ok' : 'bad') + '">' + (ok ? 'OK' : 'FALLO') + '</span>'; }

function runAll() {
  applyResolution();
  document.getElementById('desc').textContent = DESCRIPTIONS[document.getElementById('scenario').value] || '';
  var sc = document.getElementById('scenario').value;
  var counts = sc === 'MENU12' ? [12] : [1,2,4,6,8,10,12,16,20];
  document.getElementById('matrix').innerHTML = '<h2 style="margin-top:14px">Matriz' + (sc === 'MENU12' ? ' (MENU12_CANONICAL)' : ' 1–20') + '</h2><table id="mtx"><thead><tr><th>Nº</th><th>Escala</th><th>Motivo</th><th>Pág.</th><th>Reparto</th><th>Ov.</th><th>Clip</th><th>Solape</th><th>Fuera</th><th>Tot/In</th><th>Estado</th></tr></thead><tbody></tbody></table>';
  var i = 0;
  function step() {
    if (i >= counts.length) return;
    var n = counts[i++];
    var r = frame.contentWindow.eval(measureEvalCode(buildData(sc, n)));
    var tr = document.createElement('tr');
    tr.innerHTML = '<td class="num">' + n + '</td><td class="num">' + r.escala + '</td><td>' + (r.reason||'—') + '</td><td class="num">' + r.paginas.length + '</td><td class="num">' + r.paginas.join('+') + '</td>' +
      '<td>' + ((r.overflowH||r.overflowV)?'SÍ':'no') + '</td><td class="num">' + r.clip + '</td><td class="num">' + r.solape + '</td><td class="num">' + r.fuera + '</td><td class="num">' + r.total+'/'+r.entradas + '</td><td>' + pill(!!r.ok) + '</td>';
    document.querySelector('#mtx tbody').appendChild(tr);
    showKpis(sc, n, r);
    setTimeout(step, 110);
  }
  setTimeout(step, 350);
}
function runResize() {
  var sc = document.getElementById('scenario').value;
  var seq = [[1920,1080],[2560,1440],[1280,720],[3840,2160],[1920,1080]];
  document.getElementById('resizeBox').innerHTML = '<h2 style="margin-top:14px">Prueba de resize</h2><table id="rtx"><thead><tr><th>Paso</th><th>Escala</th><th>Pág.</th><th>Reparto</th><th>Ov.</th><th>Clip</th><th>Motores</th><th>Estado</th></tr></thead><tbody></tbody></table>';
  frame.contentWindow.eval('window.__engCount=0; if(!window.__engWrapped){window.__engWrapped=true; var O=LayoutEngine.Engine; LayoutEngine.Engine=function(o){window.__engCount++; return new O(o);}; }');
  var i = 0;
  function step() {
    if (i >= seq.length) return;
    var w = seq[i][0], h = seq[i][1]; var paso = i + 1; i++;
    frame.setAttribute('width', w); frame.setAttribute('height', h);
    frame.style.width = w + 'px'; frame.style.height = h + 'px';
    document.getElementById('resolution').value = w + 'x' + h; fitFrame();
    frame.contentWindow.eval('window.__engCount=0');
    setTimeout(function () {
      var r = frame.contentWindow.eval(measureEvalCode(buildData(sc, currentCount())));
      var engines = frame.contentWindow.eval('window.__engCount');
      var tr = document.createElement('tr');
      tr.innerHTML = '<td>' + paso + ' · ' + w + '×' + h + '</td><td class="num">' + r.escala + '</td><td class="num">' + r.paginas.length + '</td><td class="num">' + r.paginas.join('+') + '</td>' +
        '<td>' + ((r.overflowH||r.overflowV)?'SÍ':'no') + '</td><td class="num">' + r.clip + '</td><td class="num">' + engines + '</td><td>' + pill(!!r.ok) + '</td>';
      document.querySelector('#rtx tbody').appendChild(tr);
      showKpis(sc, currentCount(), r);
      setTimeout(step, 450);
    }, 600);
  }
  setTimeout(step, 350);
}
document.getElementById('run').onclick = run;
document.getElementById('runAll').onclick = runAll;
document.getElementById('runResize').onclick = runResize;
document.getElementById('scenario').onchange = function () { syncCounts(); run(); };
document.getElementById('resolution').onchange = run;
document.getElementById('fit').onchange = fitFrame;
window.addEventListener('resize', fitFrame);
buildCountButtons(); syncCounts();
frame.addEventListener('load', function () { setTimeout(run, 400); });
applyResolution();
</script>
</body>
</html>
